[package]
name = "usbsid-pico"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Rust driver for USBSID-Pico – interface MOS SID chips (6581/8580) and hardware emulators over USB"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sandlbn/USBSID-Pico-Rust-driver"
homepage = "https://github.com/sandlbn/USBSID-Pico-Rust-driver"
documentation = "https://docs.rs/usbsid-pico"
readme = "README.md"
keywords = ["sid", "commodore", "c64", "usb", "chiptune"]
categories = ["hardware-support", "multimedia::audio"]
exclude = [
    "target/",
    ".git/",
    ".gitignore",
    "*.h",
    "cbindgen.toml",
]

[dependencies]
rusb = "0.9.4"              # Safe libusb-1.0 bindings
log = "0.4"               # Logging facade
thiserror = "2"           # Derive macro for Error trait
serialport = { version = "4", optional = true }
[dev-dependencies]
env_logger = "0.11"       # Simple logger for examples
libc = "0.2"              # POSIX signal handling for Ctrl+C in sid_player
mos6502 = "0.8"           # MOS 6502 CPU emulator for sid_player


[features]
default = []
serial = ["dep:serialport"]  
debug_memory = []         # Equivalent of DEBUG_USBSID_MEMORY

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "simple_tone"
path = "examples/simple_tone.rs"

[[example]]
name = "sid_player"
path = "examples/sid_player.rs"